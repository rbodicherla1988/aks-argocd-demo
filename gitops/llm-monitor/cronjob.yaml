apiVersion: batch/v1
kind: CronJob
metadata:
  name: llm-monitor
  namespace: llm-monitor
  labels:
    app.kubernetes.io/name: llm-monitor
spec:
  # Conservative schedule for cost control
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # GitOps kill switch alternative: set suspend: true
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app.kubernetes.io/name: llm-monitor
        spec:
          serviceAccountName: llm-monitor
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: llm-monitor
              # Patched by build script / replace ACR_NAME before first sync
              image: ACR_NAME.azurecr.io/llm-monitor:v1
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: llm-monitor-config
                - secretRef:
                    name: llm-monitor-secrets
                    optional: false
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
